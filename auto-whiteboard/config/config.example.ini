[TTS]
# provider options: runninghub, fish, index_tts2, minimax
provider = fish
voice_library = config/voice_library.json
voice_id = warm_girl
reference_audio =
tone = 自然
concurrency = 16
retries = 3

[RunningHub]
api_key = your_runninghub_api_key_here

[RunningHubTTS]
api_key = your_runninghub_tts_api_key_here

[FishAudio]
api_key = your_fish_audio_api_key_here
base_url = https://api.fish.audio/v1
model = s2-pro
reference_id = your_fish_reference_id_here
format = mp3
latency = normal
concurrency = 16
timeout = 180

[IndexTTS2]
api_key = your_302_api_key_here
base_url = https://api.302.ai
speaker_audio_url = your_speaker_audio_url_here
emotion_audio_url =
emotion_alpha =
emotion_vector =
use_emotion_text = false
emotion_text =
concurrency = 16
timeout = 60
poll_interval = 2
max_wait_seconds = 900

[MiniMax]
api_key = your_302_or_minimax_api_key_here
api_url = https://api.302.ai/minimaxi/v1/t2a_v2
model = speech-2.8-turbo
voice_id = Chinese (Mandarin)_Warm_Bestie
speed = 1
vol = 1
pitch = 0
text_normalization = true
subtitle_type = word
output_format = url
timeout = 600
max_chars = 9000
skill_dir = %USERPROFILE%\.codex\skills\minimax-tts-pipeline

[Claude]
api_key = your_claude_api_key_here
base_url = https://api.anthropic.com

[TextToSRT]
enable_ai_split = true
speed = 4.0
pause = 0.5
min_chars = 8
max_chars = 24

[Audio]
bgm_volume = -18
fade_in = 2000
fade_out = 3000
loop_bgm = true
sample_rate = 48000

[Subtitle]
font = Microsoft YaHei
font_size = 40
max_chars_per_line = 24
primary_color = &H00FFFFFF
outline_color = &H00000000
back_color = &H80000000
outline_width = 2
shadow = 2
alignment = 2
margin_bottom = 40
margin_lr = 20

[Video]
resolution = 1920x1080
fps = 30
codec = libx264
crf = 23
preset = medium
audio_codec = aac
audio_bitrate = 192k

[Paths]
output_dir = ./output
temp_dir = ./temp
bgm_dir = ./assets/bgm
default_bgm =

[Advanced]
tts_tolerance = 0.1
tts_rate_min = 50
tts_rate_max = 200
whiteboard_jobs = 4
keep_temp_files = false
log_level = INFO
