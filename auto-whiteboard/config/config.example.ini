[TTS]
# Current recommended provider for this project.
# Options still supported by code: runninghub, fish, index_tts2, minimax
provider = minimax
voice_library = config/voice_library.json
voice_id = warm_girl
reference_audio =
tone = natural
concurrency = 16
retries = 3

[MiniMax]
# Required for the default TTS path. 302.ai MiniMax-compatible endpoint works.
api_key = your_302_or_minimax_api_key_here
api_url = https://api.302.ai/minimaxi/v1/t2a_v2
model = speech-2.8-turbo
voice_id = Chinese (Mandarin)_Warm_Bestie
speed = 1
vol = 1
pitch = 0
text_normalization = true
subtitle_type = word
output_format = url
timeout = 600
max_chars = 9000
# Leave blank to use auto-whiteboard/scripts/minimax_title_to_srt.py.
title_to_srt =
skill_dir =

[IndexTTS2]
# Optional fallback TTS provider.
api_key = your_302_api_key_here
base_url = https://api.302.ai
speaker_audio_url = your_speaker_audio_url_here
emotion_audio_url =
emotion_alpha =
emotion_vector =
use_emotion_text = false
emotion_text =
concurrency = 16
timeout = 60
poll_interval = 2
max_wait_seconds = 900

[FishAudio]
# Optional fallback TTS provider.
api_key = your_fish_audio_api_key_here
base_url = https://api.fish.audio/v1
model = s2-pro
reference_id = your_fish_reference_id_here
format = mp3
latency = normal
concurrency = 16
timeout = 180

[RunningHub]
# Optional legacy image provider.
api_key = your_runninghub_api_key_here

[RunningHubTTS]
# Optional legacy TTS provider.
api_key = your_runninghub_tts_api_key_here

[Claude]
# Optional. Leave enable_ai_split=false below if you do not want to provide this.
api_key = your_claude_api_key_here
base_url = https://api.anthropic.com

[TextToSRT]
# Keep false for the easiest agent install. It avoids requiring a Claude key.
enable_ai_split = false
speed = 4.0
pause = 0.5
min_chars = 8
max_chars = 24

[Audio]
# -28 dB keeps BGM roughly in the 10-15 percent range under narration.
bgm_volume = -28
fade_in = 2000
fade_out = 3000
loop_bgm = true
sample_rate = 48000

[Subtitle]
font = Microsoft YaHei
font_size = 88
# At 1920px output, 20 full-width Chinese characters occupy about 2/3 of the rendered frame.
max_chars_per_line = 20
primary_color = &H00FFFFFF
outline_color = &H00000000
back_color = &H80000000
outline_width = 2
shadow = 2
alignment = 2
margin_bottom = 40
margin_lr = 20

[Video]
# Whiteboard segments, subtitle canvas, and final composition are locked to 1920x1080.
# GPT Image 2 source requests use a native valid 16:9 size and are normalized before animation.
resolution = 1920x1080
fps = 30
codec = libx264
crf = 23
preset = medium
audio_codec = aac
audio_bitrate = 192k

[Paths]
output_dir = ./output
temp_dir = ./temp
bgm_dir = ../../skills/whiteboard-animation/assets/bgm
default_bgm = ../../skills/whiteboard-animation/assets/bgm/relaxing-piano-for-sleeping-312507.mp3

[Advanced]
tts_tolerance = 0.1
tts_rate_min = 50
tts_rate_max = 200
whiteboard_jobs = 4
keep_temp_files = false
log_level = INFO
