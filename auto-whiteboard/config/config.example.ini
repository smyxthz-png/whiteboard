[TTS]
# TTS provider: runninghub
provider = runninghub

# Voice library config path
voice_library = config/voice_library.json

# Voice ID from voice_library.json
voice_id = warm_girl

# Optional RunningHub uploaded reference audio filename.
reference_audio =

# Tone, for example: 自然, 魅惑, 激动, 温柔, 专业
tone = 自然

[RunningHub]
# RunningHub API key for image generation.
api_key = your_runninghub_api_key_here

[RunningHubTTS]
# RunningHub API key for TTS.
api_key = your_runninghub_tts_api_key_here

[Claude]
# Optional. If invalid or unavailable, text splitting falls back to simple splitting.
api_key = your_claude_api_key_here
base_url = https://api.anthropic.com

[TextToSRT]
speed = 4.0
pause = 0.5
min_chars = 8
max_chars = 18

[Audio]
bgm_volume = -18
fade_in = 2000
fade_out = 3000
loop_bgm = true
sample_rate = 48000

[Subtitle]
font = Microsoft YaHei
font_size = 40
max_chars_per_line = 18
primary_color = &H00FFFFFF
outline_color = &H00000000
back_color = &H80000000
outline_width = 2
shadow = 2
alignment = 2
margin_bottom = 40
margin_lr = 20

[Video]
resolution = 1920x1080
fps = 30
codec = libx264
crf = 23
preset = medium
audio_codec = aac
audio_bitrate = 192k

[Paths]
output_dir = ./output
temp_dir = ./temp
bgm_dir = ./assets/bgm
default_bgm =

[Advanced]
tts_tolerance = 0.1
tts_rate_min = 50
tts_rate_max = 200
keep_temp_files = false
log_level = INFO
